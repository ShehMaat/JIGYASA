<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIGYASA AI — Autonomous Market Intelligence Platform</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a12;
      color: #f0f0f8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(17, 17, 32, 0.9);
      border: 1px solid rgba(124, 58, 237, 0.3);
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 0 50px rgba(124, 58, 237, 0.25);
      max-width: 600px;
    }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p { color: #9ca3af; font-size: 1rem; line-height: 1.6; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.875rem 1.75rem;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 LIVE ON FIREBASE HOSTING</div>
    <h1>JIGYASA AI</h1>
    <p>Enterprise Autonomous Market Intelligence & Strategic Scenario Simulation Platform</p>
    <p style="font-size: 0.85rem; color: #6b7280;">Deployed via Firebase CLI & Next.js 15 Engine</p>
    <a href="http://localhost:3000" class="btn">Launch Local Enterprise Dashboard →</a>
  </div>
</body>
</html>
