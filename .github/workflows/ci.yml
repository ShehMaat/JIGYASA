name: Alkame AI Platform CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Python Backend Syntax & Import Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Code Compilation
        run: |
          python -m py_compile backend/app/main.py backend/app/core/config.py backend/app/core/database.py backend/app/models/intelligence.py backend/app/models/monitoring.py backend/app/models/user.py backend/app/schemas/intelligence.py backend/app/services/search_service.py backend/app/services/rag_service.py backend/app/agents/research_agent.py backend/app/api/v1/api.py backend/app/api/v1/endpoints/research.py backend/app/api/v1/endpoints/projects.py backend/app/api/v1/endpoints/knowledge.py backend/app/api/v1/endpoints/monitoring.py backend/app/api/v1/endpoints/auth.py

  frontend-checks:
    name: Next.js Frontend Build & ESLint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint Verification
        working-directory: ./frontend
        run: npm run lint

      - name: Run Next.js Production Build
        working-directory: ./frontend
        run: npm run build
